name: validate

# Runs on every branch push (not just PRs) so auto-created PRs — which don't
# emit pull_request events for GITHUB_TOKEN — still get the required check
# on their head commit.
on:
  pull_request:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/validate.sh
